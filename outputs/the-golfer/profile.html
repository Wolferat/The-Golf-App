<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile & Settings · Golfolio</title>
  <link rel="stylesheet" href="/assets/shared.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="Golfolio"></a>
    <div class="top-actions">
      <small>Account & player info</small>
      <button class="ghost-top" id="accountButton" type="button">Sign in</button>
      <button class="button alt hidden" id="signupButton" type="button">Sign up free</button>
      <div id="accountMenu" class="account-menu hidden"></div>
    </div>
  </header>

  <main class="app-shell">
    <p class="page-kicker">Profile & settings</p>
    <h1 class="page-title">Your golfer profile</h1>
    <p class="page-copy">Your username is visible to other golfers. Optional details stay private unless you choose otherwise.</p>
    <section class="panel-card" style="margin-top:24px" id="profileRoot"><p class="muted">Loading...</p></section>
  </main>

  <nav class="mobile-nav" aria-label="App navigation">
    <a href="/"><span>H</span>Home</a>
    <a href="/hub"><span>G</span>My game</a>
    <a href="/players"><span>P</span>Players</a>
  </nav>

  <script src="/assets/auth.js"></script>
  <script>
    const { $, escapeHtml, playerAvatar, getConfig, getSession, loadProfile, requireAuth, bindAppHeader, ensureLoginModal } = Golfolio;
    ensureLoginModal();
    const avatars = ['P','G','F','B','C'];

    async function saveProfile(form){
      const session = getSession();
      const c = await getConfig();
      const profile = await loadProfile();
      if(!profile?.id) throw new Error('Could not resolve your profile id.');
      const payload = {
        first_name: form.firstName.value.trim() || null,
        last_name: form.lastName.value.trim() || null,
        phone: form.profilePhone.value.trim() || null,
        avatar: form.dataset.avatar || 'G',
        bio: form.profileBio.value.trim() || null,
        home_course: form.homeCourse.value.trim() || null,
        state: (form.profileState.value.trim() || '').toUpperCase().slice(0,2) || null,
        handicap: form.handicap.value === '' ? null : Number(form.handicap.value)
      };
      // Never persist city from this form — state only for privacy.
      const r = await fetch(`${c.supabaseUrl}/rest/v1/profiles?id=eq.${profile.id}`, {
        method: 'PATCH',
        headers: {
          apikey: c.supabaseAnonKey,
          Authorization: 'Bearer ' + session.access_token,
          'Content-Type': 'application/json',
          Prefer: 'return=representation'
        },
        body: JSON.stringify(payload)
      });
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.message || d.hint || 'Could not save profile. If state fails, run mission-control-migration.sql.');
      return Array.isArray(d) ? d[0] : d;
    }

    async function render(){
      const root = $('#profileRoot');
      try{
        const profile = await loadProfile();
        if(!profile) throw new Error('Could not load your profile.');
        root.innerHTML = `
          <div class="profile-avatar" style="margin-bottom:16px">${playerAvatar(profile)}</div>
          <p class="muted">Signed in as <strong>@${escapeHtml(profile.username)}</strong></p>
          <form class="form" id="profileForm" data-avatar="${escapeHtml(profile.avatar || 'G')}">
            <label for="firstName">First name (optional)</label>
            <input id="firstName" name="firstName" maxlength="60" value="${escapeHtml(profile.first_name)}">
            <label for="lastName">Last name (optional)</label>
            <input id="lastName" name="lastName" maxlength="60" value="${escapeHtml(profile.last_name)}">
            <label for="profilePhone">Phone number (optional)</label>
            <input id="profilePhone" name="profilePhone" type="tel" maxlength="30" value="${escapeHtml(profile.phone)}">
            <label for="profileBio">Bio (optional)</label>
            <textarea id="profileBio" name="profileBio" maxlength="280">${escapeHtml(profile.bio)}</textarea>
            <label for="homeCourse">Home course (optional)</label>
            <input id="homeCourse" name="homeCourse" maxlength="120" value="${escapeHtml(profile.home_course)}">
            <div class="form-split">
              <div>
                <label for="profileState">State (public)</label>
                <input id="profileState" name="profileState" maxlength="2" placeholder="TX" value="${escapeHtml(profile.state || '')}">
              </div>
              <div>
                <label for="handicap">Handicap (public)</label>
                <input id="handicap" name="handicap" type="number" step="0.1" min="-10" max="54" value="${profile.handicap ?? ''}">
              </div>
            </div>
            <p class="muted" style="margin:0">City and distance are never shown on player cards. State code only.</p>
            <label>Choose a golf avatar</label>
            <div class="avatar-picker">${avatars.map(x=>`<button class="avatar-choice ${profile.avatar===x?'selected':''}" type="button" data-avatar="${x}">${x}</button>`).join('')}</div>
            <button class="button" type="submit">Save profile</button>
            <p class="status" id="profileStatus"></p>
          </form>`;
        const form = $('#profileForm');
        form.querySelectorAll('[data-avatar]').forEach(btn => btn.onclick = () => {
          form.dataset.avatar = btn.dataset.avatar;
          form.querySelectorAll('.avatar-choice').forEach(x => x.classList.toggle('selected', x === btn));
        });
        form.onsubmit = async e => {
          e.preventDefault();
          const s = $('#profileStatus');
          s.textContent = 'Saving...';
          s.classList.remove('err');
          try{
            await saveProfile(form);
            s.textContent = 'Profile saved.';
            await bindAppHeader();
          }catch(err){ s.textContent = err.message; s.classList.add('err'); }
        };
      }catch(e){
        root.innerHTML = `<p class="status err">${escapeHtml(e.message)}</p>`;
      }
    }

    (async () => {
      if(!requireAuth()) return;
      await bindAppHeader();
      await render();
    })();
  </script>
</body>
</html>
