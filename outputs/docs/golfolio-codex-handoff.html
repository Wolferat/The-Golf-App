Roles (keep this rhythm)
- Composer/Cursor builds the wall: structure, routing, auth wiring, APIs, menu -> page navigation.

- Never deploy directly to production.
- Use PR branch -> push -> PR -> merge -> normal Vercel deploy.
- Keep Golfolio's current look. Do not invent a new brand.

This pass (Codex focus)
When a signed-in user clicks:
- My game
- Find players
- Account & player info
- related entries (hero Open my game, mobile nav My game / Players)

...do not open a modal/card.
Turn those into real pages with normal browser navigation (URL + back button). Better mobile behavior is the goal.

Do not deeply redesign each page's content yet. Next pass will refine individual pages. This pass = page destinations + visual continuity.


USER PROMPT / STANDING BRIEF (include + obey)

REPO & PATHS (critical)
- GitHub repo: Wolferat/The-Golf-App
- Branch: main (production source of truth)
- App root on disk: outputs/the-golfer/  <- NOT the repo root
- Vercel project root is also: outputs/the-golfer

LIVE URLS
- Production (test here): https://the-golf-app-eight.vercel.app
- Do NOT use Vercel preview URLs for API testing - Standard Protection blocks /api/* on previews

WHAT THIS APP IS
- Static index.html + Vercel serverless APIs
- Supabase auth + profiles
- Player hub: /api/player (rounds, follows, stats)
- Admin: /api/admin, /api/company
- Listings: /api/listings, discovery cron: /api/discovery

KEY FILES
- outputs/the-golfer/index.html - main UI (signup, login, player hub, modals, JS)
- outputs/the-golfer/api/*.js - backend routes
- outputs/the-golfer/supabase/player-hub-migration.sql - run in Supabase if player hub fails
- outputs/the-golfer/vercel.json - cron config

KNOWN LANDMINES (do not repeat)
- index.html was corrupted before by truncation which broke ALL buttons
- Never truncate or shorten index.html - edit surgically or in sections
- Restoring an old index.html fixes buttons but removes player hub - need BOTH
- Localhost static preview does NOT serve /api/* - test on production URL only

WHEN SIGNED IN, USER EXPECTS
- "Open my game" -> player hub (stats, round history, log round)
- Account menu: My game, Find players, Account & player info
- Mobile bottom nav on small screens: Home / My game / Players

DEPLOY WORKFLOW
1. Commit + push via PR (no direct prod deploy from agent)
2. Verify production HTML still has working signup/login + hub markers
3. Hard refresh when testing (Ctrl+Shift+R / cache)

ENV (already on Vercel - do not commit secrets)
- SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
- OPENAI_API_KEY, CRON_SECRET

RULES
- Minimize scope; don't refactor unrelated code
- Tell me exactly what URL to test and what button/action to try
- If email signup fails, check Supabase SMTP (Resend) separately from UI bugs
- Do not force-push main
- Never deploy directly to production


CURRENT STATE

Working
- Landing board + listings
- Sign up works
- Sign in fix is in PR #6 (cursor/fix-signin-button-20b8) - header Sign in opens login form even if session restore fails

- Find players / openPlayerHub('players') -> same modal, players view
- Account & player info / openProfile() -> #profileModal

- Sign in / Sign up / Reset password

- Admin company/review (leave alone this pass)


PLANNED CHANGE (for Codex to execute / polish)

Routes (simple static pages under outputs/the-golfer/)
- /hub -> My game
- /players -> Find players
- /account -> Account & player info
- / -> Home / launch board

- Mobile bottom nav -> same pages

  - Playfair Display, DM Sans, DM Mono
  - forest / green / lime / cream / paper palette
- Same header brand treatment, buttons, radii, spacing language
- Pages must feel like Golfolio continued, not a different product
- No purple redesign, no generic dashboard look, no Inter-only restyle

- Do not truncate index.html
- Do not break signup/login

Done means
1. Click My game -> full page (URL changes)
2. Click Find players -> full page
3. Click Account & player info -> full page
4. Mobile nav My game / Players -> pages
5. Browser back works
6. Visual style matches landing

Non-goals this pass

- No fake listings/profiles

TEST PLAN

3. Sign in

5. Find players -> page

Composer note
